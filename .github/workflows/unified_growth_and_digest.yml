name: Unified Agency Arbitrage & Store Growth Engine

on:
  schedule:
    - cron: '19 */3 * * *'  # Runs every 3 hours at off-peak minute :19 to avoid top-of-hour queue drops
  workflow_dispatch:

jobs:
  growth_and_digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Agency Arbitrage Engine & Store Data Pipeline
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python scripts/test_outreach.py
          python scripts/compile_store_products.py --if-stale-hours 23
          python scripts/agency_dealmaker.py --mode b2b-pack --limit 200 --no-save
          python scripts/unified_empire_engine.py

      - name: Persist Contacted Leads & Store Data State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/contacted_leads.json data/latest_base_alpha.json data/latest_b2b_leads.json data/store_snapshots.js
          if ! git diff --staged --quiet; then
            if git diff --staged --name-only | grep -q "store_snapshots.js"; then
              git commit -m "chore: refresh daily /store intelligence datasets"
            else
              git commit -m "chore: persist updated contacted leads state [skip ci]"
            fi
            git push origin main
          fi
